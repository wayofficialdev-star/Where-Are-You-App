name: app
description: Project template for Hancod Tech team
version: 1.0.0+1
publish_to: none

environment:
  sdk: "^3.11.0"

dependencies:
  cached_network_image: ^3.3.1
  collection: ^1.18.0
  connectivity_plus: ^7.3.2
  facebook_app_events: ^0.32.0
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  flutter:
    sdk: flutter
  flutter_form_builder: ^9.4.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  flutter_svg: ^2.0.9
  flutter_web_plugins:
    sdk: flutter
  form_builder_extra_fields: ^11.0.0
  form_builder_validators: ^11.1.2
  freezed_annotation: ^2.4.1
  go_router: ^14.2.3
  hancod_theme:
    git:
      url: https://github.com/Hancod-Digital/hancod_theme.git
      # Pinned to master HEAD (2026-11-05) for reproducible builds.
      ref: a3cdcbce3122b85a2c282259b6a63aec04d45dd0
  http: ^1.2.2
  image_picker: ^1.2.4
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path_provider: ^2.1.2
  # pdf 3.12 allows image >= 4.6, whose archive API clashes with the archive
  # version pdf still pins (< 4.1.0). Stay on the 3.11 line.
  pdf: '>=3.11.1 <3.12.0'
  phone_form_field: ^10.0.5
  printing: ^5.14.2
  riverpod: ^2.5.0
  riverpod_annotation: ^2.3.4
  scaled_app: 2.2.0
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.5.3
  timezone: ^0.9.2
  upgrader: ^13.7.0

# form_builder_extra_fields 11.x declares `intl: ^0.19.0`, but the Flutter SDK's
# flutter_localizations pins intl 0.20.2. The extra_fields intl usage is limited
# to date formatting and is source-compatible with 0.20; this override keeps the
# Hancod theme's intended form stack (flutter_form_builder 9.x).
dependency_overrides:
  intl: 0.20.2

dev_dependencies:
  build_runner: ^2.4.8
  custom_lint: ^0.6.0
  flutter_test:
    sdk: flutter
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  mocktail: ^1.0.3
  riverpod_generator: ^2.3.10
  riverpod_lint: ^2.3.9
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true
  generate: true
  assets: 
    - assets/images/
